<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magisterka – Planer Aniki</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink2: #555555;
  --ink3: #999999;
  --line: #e0e0e0;
  --line2: #c0c0c0;
  --accent: #0a0a0a;
  --accent-bg: #f0f0f0;
  --red: #d63030;
  --red-bg: #fff0f0;
  --blue: #1a5cff;
  --blue-bg: #f0f4ff;
  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);font-family:'Syne',sans-serif;font-size:16px;line-height:1.6}
body{min-height:100vh;padding-bottom:4rem}

/* ── layout ── */
.app{max-width:1000px;margin:0 auto;padding:0 2.5rem}
header{padding:2.5rem 0 1.75rem;border-bottom:2px solid var(--ink);margin-bottom:2.5rem;display:flex;align-items:baseline;gap:1.5rem;flex-wrap:wrap}
header h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-transform:uppercase}
header h1 em{font-style:normal;font-weight:400;color:var(--ink2)}
header p{color:var(--ink3);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}

/* ── tabs ── */
nav{display:flex;gap:0;flex-wrap:wrap;margin-bottom:2.5rem;border-bottom:1px solid var(--line)}
.tab-btn{padding:.7rem 1.5rem;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:-1px;transition:color .1s,border-color .1s}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}

/* ── sections ── */
.section{display:none}.section.active{display:block}

/* ── cards / forms ── */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem 1.75rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-row{margin-bottom:.7rem}
label.lbl{display:block;font-size:.7rem;color:var(--ink3);margin-bottom:.35rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);color:var(--ink);font-family:'Syne',sans-serif;font-size:.95rem;transition:border-color .1s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--bg)}
.btn{padding:.55rem 1.1rem;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);color:var(--ink);cursor:pointer;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:all .1s}
.btn:hover{background:var(--accent-bg);border-color:var(--ink)}
.btn-sage{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-sage:hover{background:#333;border-color:#333}
.btn-sm{padding:.35rem .75rem;font-size:.75rem}
.row-flex{display:flex;gap:.6rem;align-items:center}
.spacer{flex:1}

/* ── section headings ── */
h2{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:1.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:.7rem}

/* ── badges ── */
.badge{display:inline-block;padding:.2rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.b-sage{background:var(--accent-bg);color:var(--ink)}
.b-rose{background:var(--red-bg);color:var(--red)}
.b-gold{background:#fff8e6;color:#b07800}
.b-gray{background:var(--accent-bg);color:var(--ink3)}

/* ── task rows ── */
.task-item{display:flex;align-items:flex-start;gap:.6rem;padding:.4rem .5rem;border-radius:var(--r-sm);background:transparent;margin-bottom:.2rem;transition:opacity .3s}
.task-item:hover{background:var(--accent-bg)}
.task-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;flex-shrink:0;margin-top:3px;accent-color:var(--ink)}
.task-name{font-size:.9rem;font-weight:500;transition:all .2s;line-height:1.4}
.task-name.done{text-decoration:line-through;color:var(--ink3)}
.task-meta{font-size:.75rem;color:var(--ink3);margin-top:.1rem;font-weight:400}
.task-item.fade-out{opacity:0}

/* ── monthly task view ── */
.tasks-month-nav{display:flex;align-items:center;gap:.75rem;margin-bottom:0}
.tasks-month-nav span{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1;text-align:center}
.month-grid{display:flex;flex-direction:column;gap:0}
.day-row{display:flex;gap:0;border-bottom:1px solid var(--line);min-height:64px}
.day-row:first-child{border-top:1px solid var(--line)}
.day-row.is-today .day-num-col{background:#ffd6e3}
.day-row.is-today .day-num{color:#c0607a}
.day-row.is-today .day-name{color:#d4889a}
.day-row.is-past .day-num{color:var(--ink3)}
.day-row.is-past .day-name{color:var(--line2)}
.day-row.is-weekend .day-num-col{background:var(--accent-bg)}
.day-num-col{width:58px;flex-shrink:0;padding:.6rem .4rem;border-right:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.7rem}
.day-num{font-size:1rem;font-weight:700;color:var(--ink);line-height:1}
.day-name{font-size:.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem}
.day-content{flex:1;padding:.5rem .75rem;min-width:0}
.day-tasks-list{margin-bottom:.3rem}
.day-add-row{display:flex;align-items:center;gap:.4rem}
.day-quick-input{flex:1;padding:.3rem .5rem;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--ink);font-family:'Syne',sans-serif;font-size:.875rem;transition:all .1s}
.day-quick-input:hover{border-color:var(--line);background:var(--accent-bg)}
.day-quick-input:focus{border-color:var(--ink);background:var(--bg);outline:none}
.day-quick-input::placeholder{color:var(--ink3)}
.day-time-inputs{display:none;gap:.4rem;align-items:center;margin-top:.3rem;flex-wrap:wrap}
.day-time-inputs.show{display:flex}
.day-time-inputs input{padding:.25rem .4rem;font-size:.8rem}
.day-add-confirm{padding:.25rem .6rem;font-size:.75rem}
.day-cancel-btn{background:transparent;border:none;cursor:pointer;color:var(--ink3);font-size:.9rem;padding:.1rem .4rem;line-height:1;flex-shrink:0;transition:color .1s}
.day-cancel-btn:hover{color:var(--red)}
.day-deadline-chip{font-size:.7rem;padding:.2rem .55rem;border-radius:99px;background:var(--red-bg);color:var(--red);margin-bottom:.25rem;display:inline-block;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.overdue-banner{background:var(--accent-bg);border-left:3px solid var(--ink);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:.5rem .85rem;margin-bottom:.85rem;font-size:.8rem;color:var(--ink);display:flex;align-items:center;gap:.5rem;font-weight:600;letter-spacing:.04em}
@media(max-width:600px){.day-num-col{width:44px}.day-num{font-size:.875rem}}

/* ── deadline rows ── */
.dl-item{display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);margin-bottom:.5rem;box-shadow:var(--shadow)}
.dl-name{font-size:.95rem;font-weight:600;flex:1}
.dl-sub{font-size:.775rem;color:var(--ink3)}
.dl-done .dl-name{text-decoration:line-through;opacity:.4}

/* ── book rows ── */
.book-item{display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);margin-bottom:.5rem;box-shadow:var(--shadow)}
.book-title{font-size:.95rem;font-weight:600;flex:1}
.book-sub{font-size:.775rem;color:var(--ink3)}
.progress-wrap{background:var(--accent-bg);border-radius:99px;height:3px;overflow:hidden;margin-top:.5rem}
.progress-fill{height:100%;background:var(--ink);border-radius:99px;transition:width .3s}

/* ── calendar ── */
.cal-nav{display:flex;align-items:center;gap:.75rem;margin-bottom:1.1rem}
.cal-nav span{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:transparent}
.cal-hdr{text-align:center;font-size:.65rem;color:var(--ink3);font-weight:700;padding:.35rem 0;background:var(--bg);text-transform:uppercase;letter-spacing:.08em}
.cal-cell{min-height:72px;border-radius:var(--r-sm);padding:.35rem .4rem;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:background .1s;vertical-align:top}
.cal-cell:hover{background:var(--accent-bg)}
.cal-cell.today{background:#ffd6e3;border-color:#ffd6e3}
.cal-cell.today .cal-num{color:#c0607a}
.cal-cell.other{opacity:.3}
.cal-num{font-size:.75rem;font-weight:700;color:var(--ink);margin-bottom:.2rem}
.cal-dot{font-size:.65rem;padding:.05rem .3rem;border-radius:4px;margin-bottom:.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-dot.t{background:var(--blue-bg);color:var(--blue)}
.cal-dot.d{background:var(--red-bg);color:var(--red)}
.cal-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.85rem;font-size:.7rem;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.cal-legend span::before{content:'▪ ';font-size:.6rem}

/* ── github instructions ── */
.gh-box{background:var(--accent-bg);border:1px solid var(--line);padding:1.25rem 1.5rem;margin-top:1.5rem}
.gh-box h3{margin-bottom:.75rem;color:var(--ink)}
.gh-box ol{padding-left:1.25rem;color:var(--ink2);font-size:.875rem;line-height:2}
.gh-box code{background:#fff;border:1px solid var(--line2);padding:.1rem .35rem;font-size:.8rem;color:var(--ink)}

/* ── task edit modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 16px 48px rgba(0,0,0,.12);padding:2rem;width:100%;max-width:400px}
.modal-box h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:1.35rem}
.modal-row{margin-bottom:.75rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.35rem}

/* ── backlog ── */
.backlog-input-row{margin-bottom:.5rem}
.backlog-input-row input{width:100%}
.backlog-date-row{display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.75rem;flex-wrap:wrap}
.backlog-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);margin-bottom:.35rem;cursor:grab;transition:box-shadow .15s,opacity .15s;user-select:none;box-shadow:var(--shadow)}
.backlog-item:first-child{border-top:none}
.backlog-item:hover{background:var(--accent-bg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.backlog-item:active{cursor:grabbing}
.backlog-item.dragging{opacity:.4}
.backlog-item .bl-handle{color:var(--line2);font-size:.75rem;flex-shrink:0}
.backlog-item .bl-name{flex:1;font-size:.8rem;font-weight:500}
.backlog-item .bl-del{background:transparent;border:none;cursor:pointer;color:var(--line2);font-size:.75rem;padding:.1rem .3rem;line-height:1;flex-shrink:0;transition:color .1s}
.backlog-item .bl-del:hover{color:var(--red)}

/* ── plan layout with sidebar ── */
.plan-layout{display:grid;grid-template-columns:200px 1fr;gap:2rem;align-items:start}
.plan-sidebar{position:sticky;top:1rem}
.plan-sidebar .card{padding:.85rem 1rem;margin-bottom:0;border-radius:var(--r)}
.plan-sidebar h3{margin-bottom:.5rem}
.sidebar-backlog-list{min-height:40px}

/* day-row drop target */
.day-content.drag-over{background:var(--accent-bg);border-radius:var(--r-sm)}

/* ── past days collapsible ── */
.past-days-details{margin-top:.5rem}
.past-days-summary{list-style:none;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;cursor:pointer;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:var(--r-sm);user-select:none;transition:background .1s}
.past-days-summary::-webkit-details-marker{display:none}
.past-days-summary:hover{background:var(--accent-bg);color:var(--ink)}
.past-days-summary::before{content:'▸';font-size:.7rem;transition:transform .15s;display:inline-block}
.past-days-details[open] .past-days-summary::before{transform:rotate(90deg)}
.past-days-details[open] .past-days-summary{border-radius:var(--r-sm) var(--r-sm) 0 0;border-bottom-color:transparent}
.past-days-details .month-grid{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r-sm) var(--r-sm)}

/* sunday block */
.day-row.is-sunday .day-num-col{background:#f5f5f5}
.day-row.is-sunday .day-num{color:#bbb}
.day-row.is-sunday .day-name{color:#ccc}
.day-sunday-block{flex:1;background:repeating-linear-gradient(135deg,#fafafa,#fafafa 4px,#f3f3f3 4px,#f3f3f3 8px);cursor:not-allowed}

/* ── empty ── */
.empty-msg{text-align:center;padding:2rem;color:var(--ink3);font-size:.775rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}

/* ── responsive ── */
@media(max-width:700px){
  .plan-layout{grid-template-columns:1fr}
  .plan-sidebar{position:static}
}
@media(max-width:600px){
  .form-grid,.form-grid.g3{grid-template-columns:1fr}
  header h1{font-size:1.2rem}
  .app{padding:0 1rem}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Planer <em>Aniki</em></h1>
    <span id="sync-status" style="margin-left:auto;font-size:.7rem;font-weight:600;letter-spacing:.06em;color:var(--ink3)">⟳ Łączenie...</span>
  </header>

  <nav>
    <button class="tab-btn active" onclick="showTab('tasks')">Plan</button>
    <button class="tab-btn" onclick="showTab('books')">Zadania</button>
    <button class="tab-btn" onclick="showTab('deadlines')">Terminy</button>
    <button class="tab-btn" onclick="showTab('calendar')">Kalendarz</button>
  </nav>

  <!-- ════ TASKS ════ -->
  <div id="tasks" class="section active">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <h2 style="margin-bottom:0">Plan</h2>
      <div class="tasks-month-nav" style="margin-bottom:0;flex:1;min-width:220px">
        <button class="btn btn-sm" onclick="changeTasksMonth(-1)">←</button>
        <span id="tasks-month-label"></span>
        <button class="btn btn-sm" onclick="changeTasksMonth(1)">→</button>
      </div>
    </div>
    <div id="tasks-overdue-banner"></div>
    <div class="plan-layout">
      <aside class="plan-sidebar">
        <div class="card">
          <h3>📋 Backlog</h3>
          <div id="sidebar-backlog-list" class="sidebar-backlog-list"></div>
          <div style="margin-top:.5rem;font-size:.7rem;color:var(--ink3);text-align:center">← przeciągnij na dzień</div>
        </div>
      </aside>
      <div id="tasks-month-grid" class="month-grid"></div>
    </div>
  </div>

  <!-- ════ DEADLINES ════ -->
  <div id="deadlines" class="section">
    <h2>Terminy i etapy</h2>
    <div class="card">
      <div class="form-grid">
        <div class="form-row"><label class="lbl">Nazwa etapu</label><input type="text" id="d-name" placeholder="np. Rozdział 2 – metodologia"></div>
        <div class="form-row"><label class="lbl">Termin oddania</label><input type="date" id="d-date"></div>
      </div>
      <div class="form-row"><label class="lbl">Opis (opcjonalnie)</label><input type="text" id="d-desc" placeholder=""></div>
      <div style="text-align:right;margin-top:.5rem"><button class="btn btn-sage" onclick="addDeadline()">+ Dodaj termin</button></div>
    </div>
    <div id="deadlines-list"></div>
  </div>

  <!-- ════ BOOKS ════ -->
  <div id="books" class="section">
    <h2>Zadania</h2>

    <!-- backlog dump -->
    <div class="card" style="margin-bottom:1.5rem">
      <h3 style="margin-bottom:.75rem">📋 Backlog – sprawy do załatwienia</h3>
      <div class="backlog-input-row">
        <input type="text" id="bl-input" placeholder="Wpisz sprawę..." onkeydown="onBacklogKey(event)">
      </div>
      <div class="backlog-date-row">
        <div class="form-row" style="margin-bottom:0;flex:1"><label class="lbl">Data (opcjonalnie)</label><input type="date" id="bl-date"></div>
        <div class="form-row" style="margin-bottom:0;width:82px"><label class="lbl">Od (opcjonalnie)</label><input type="time" id="bl-from" placeholder="09:00"></div>
        <div style="align-self:flex-end"><button class="btn btn-sage" onclick="addBacklogItem()">+ Dodaj</button></div>
      </div>
      <div id="backlog-list"></div>
    </div>

    <!-- literatura (original books form) -->
    <h3 style="margin-bottom:.75rem;margin-top:.25rem">📚 Literatura</h3>
    <div class="card">
      <div class="form-grid">
        <div class="form-row"><label class="lbl">Autor – Tytuł</label><input type="text" id="b-title" placeholder="np. Kowalski J. – Teoria X"></div>
        <div class="form-row"><label class="lbl">Rok</label><input type="number" id="b-year" placeholder="2022" min="1800" max="2030"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label class="lbl">Status</label>
          <select id="b-status">
            <option value="do przeczytania">Do przeczytania</option>
            <option value="w trakcie">W trakcie</option>
            <option value="przeczytana">Przeczytana</option>
          </select>
        </div>
        <div class="form-row"><label class="lbl">Strony / rozdział</label><input type="text" id="b-chapter" placeholder="np. str. 1–80"></div>
      </div>
      <div style="text-align:right;margin-top:.5rem"><button class="btn btn-sage" onclick="addBook()">+ Dodaj pozycję</button></div>
    </div>
    <div id="books-progress"></div>
    <div id="books-list"></div>
  </div>

  <!-- ════ CALENDAR ════ -->
  <div id="calendar" class="section">
    <h2>Kalendarz</h2>
    <div class="cal-nav">
      <button class="btn btn-sm" onclick="changeMonth(-1)">←</button>
      <span id="month-label"></span>
      <button class="btn btn-sm" onclick="changeMonth(1)">→</button>
    </div>
    <div class="cal-grid" id="cal-headers"></div>
    <div class="cal-grid" id="cal-body" style="margin-top:3px"></div>
    <div class="cal-legend">
      <span style="color:#185fa5">Zadanie</span>
      <span style="color:var(--rose)">Termin</span>
    </div>
  </div>
</div>

<!-- ════ EDIT BOOK MODAL ════ -->
<div id="edit-book-modal" class="modal-overlay" style="display:none" onclick="closeBookModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>Edytuj książkę</h3>
    <div class="modal-row"><label class="lbl">Autor – Tytuł</label><input type="text" id="ebm-title"></div>
    <div class="form-grid" style="gap:.5rem;margin-bottom:.65rem">
      <div><label class="lbl">Rok</label><input type="number" id="ebm-year" min="1800" max="2030"></div>
      <div><label class="lbl">Strony / rozdział</label><input type="text" id="ebm-chapter"></div>
    </div>
    <div class="modal-row"><label class="lbl">Status</label>
      <select id="ebm-status">
        <option value="do przeczytania">Do przeczytania</option>
        <option value="w trakcie">W trakcie</option>
        <option value="przeczytana">Przeczytana</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeBookModal()">Anuluj</button>
      <button class="btn btn-sage" onclick="saveBookModal()">Zapisz</button>
    </div>
  </div>
</div>

<!-- ════ EDIT BACKLOG MODAL ════ -->
<div id="edit-backlog-modal" class="modal-overlay" style="display:none" onclick="closeBacklogModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>Edytuj sprawę</h3>
    <div class="modal-row"><label class="lbl">Nazwa</label><input type="text" id="ebl-name"></div>
    <div class="modal-row"><label class="lbl">Data (opcjonalnie)</label><input type="date" id="ebl-date"></div>
    <div class="modal-row"><label class="lbl">Godzina od (opcjonalnie)</label><input type="time" id="ebl-from"></div>
    <div class="modal-actions">
      <button class="btn" style="color:var(--red);border-color:var(--red)" onclick="deleteBacklogFromModal()">Usuń</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="closeBacklogModal()">Anuluj</button>
      <button class="btn btn-sage" onclick="saveBacklogModal()">Zapisz</button>

<div id="edit-modal" class="modal-overlay" style="display:none" onclick="closeEditModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3>✏️ Edytuj zadanie</h3>
    <div class="modal-row"><label class="lbl">Nazwa</label><input type="text" id="em-name"></div>
    <div class="modal-row"><label class="lbl">Data</label><input type="date" id="em-date"></div>
    <div style="display:flex;gap:.5rem">
      <div class="modal-row" style="flex:1"><label class="lbl">Od</label><input type="time" id="em-from" onchange="autoFillModalTo()"></div>
      <div class="modal-row" style="flex:1"><label class="lbl">Do</label><input type="time" id="em-to"></div>
    </div>

      <button class="btn" onclick="closeEditModal()">Anuluj</button>
      <button class="btn btn-sage" onclick="saveEditModal()">Zapisz</button>

<script>
// ── FIREBASE CONFIG ────────────────────────────────────
// 👇 WKLEJ TUTAJ SWÓJ firebaseConfig Z KONSOLI FIREBASE
var firebaseConfig = {
  apiKey:            "TWOJ_API_KEY",
  authDomain:        "TWOJ_PROJECT.firebaseapp.com",
  projectId:         "TWOJ_PROJECT_ID",
  storageBucket:     "TWOJ_PROJECT.appspot.com",
  messagingSenderId: "TWOJ_SENDER_ID",
  appId:             "TWOJ_APP_ID"
};

// ── STATE ──────────────────────────────────────────────
var S = {tasks:[],deadlines:[],books:[],backlog:[],
         calY:new Date().getFullYear(),calM:new Date().getMonth()};
var TODAY = new Date().toISOString().split('T')[0];

// ── FIREBASE INIT ──────────────────────────────────────
var db = null;
var DOC_ID = 'planer'; // jeden dokument dla całej aplikacji

function initFirebase(){
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    setSyncStatus('loading');
    // nasłuchuj zmian w czasie rzeczywistym
    db.collection('data').doc(DOC_ID).onSnapshot(function(doc){
      if(doc.exists){
        var data=doc.data();
        S=Object.assign({tasks:[],deadlines:[],books:[],backlog:[],
          calY:new Date().getFullYear(),calM:new Date().getMonth()},data);
        refreshAll();
      }
      setSyncStatus('ok');
    }, function(err){
      console.error('Firebase error:',err);
      setSyncStatus('error');
      loadLocal(); // fallback do localStorage
      refreshAll();
    });
  } catch(e){
    console.error('Firebase init error:',e);
    setSyncStatus('error');
    loadLocal();
    refreshAll();
  }
}

function save(){
  // zawsze zapisuj lokalnie jako backup
  try{localStorage.setItem('zspl2',JSON.stringify(S))}catch(e){}
  // zapisuj do Firebase jeśli połączono
  if(!db){return;}
  setSyncStatus('saving');
  db.collection('data').doc(DOC_ID).set(JSON.parse(JSON.stringify(S)))
    .then(function(){setSyncStatus('ok')})
    .catch(function(e){console.error(e);setSyncStatus('error')});
}

function loadLocal(){
  try{var d=localStorage.getItem('zspl2');
    if(d)S=Object.assign({tasks:[],deadlines:[],books:[],backlog:[],
      calY:new Date().getFullYear(),calM:new Date().getMonth()},JSON.parse(d));
  }catch(e){}
}

function setSyncStatus(st){
  var el=document.getElementById('sync-status');
  if(!el)return;
  var states={
    loading: {text:'⟳ Łączenie...', color:'var(--ink3)'},
    saving:  {text:'⟳ Zapisywanie...', color:'var(--ink3)'},
    ok:      {text:'✓ Zsynchronizowano', color:'#1a8a4a'},
    error:   {text:'✕ Offline – dane lokalne', color:'var(--red)'}
  };
  var s=states[st]||states.ok;
  el.textContent=s.text;
  el.style.color=s.color;
}

function refreshAll(){
  renderTasks();renderSidebarBacklog();renderBacklog();renderDeadlines();renderBooks();
}

// ── tabs ───────────────────────────────────────────────
function showTab(n){
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',['tasks','books','deadlines','calendar'][i]===n)});
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.getElementById(n).classList.add('active');
  if(n==='calendar')renderCalendar();
  if(n==='tasks'){renderTasks();renderSidebarBacklog();}
  if(n==='deadlines')renderDeadlines();
  if(n==='books'){renderBacklog();renderBooks();}
}

function daysUntil(ds){var a=new Date(ds),b=new Date(TODAY);a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}

// ── TASKS – monthly view ───────────────────────────────
var taskViewY=new Date().getFullYear();
var taskViewM=new Date().getMonth();

function changeTasksMonth(dir){
  taskViewM+=dir;
  if(taskViewM>11){taskViewM=0;taskViewY++}
  if(taskViewM<0){taskViewM=11;taskViewY--}
  renderTasks();
}

function addTaskForDay(ds){
  var inp=document.getElementById('qi-'+ds);
  var name=inp?inp.value.trim():'';
  if(!name)return;
  var fr=document.getElementById('qf-'+ds);
  var fromVal=fr?fr.value:'09:00';
  var toVal=addOneHour(fromVal);
  S.tasks.push({id:Date.now(),name:name,date:ds,from:fromVal,to:toVal,hours:1,note:'',done:false});
  save();renderTasks();
}

function showDayTimeInputs(ds){
  var wrap=document.getElementById('qt-wrap-'+ds);
  if(wrap)wrap.classList.add('show');
  var xBtn=document.getElementById('qx-'+ds);
  if(xBtn)xBtn.style.display='block';
  var inp=document.getElementById('qi-'+ds);
  if(inp)inp.focus();
}

function onDayKeydown(e,ds){
  if(e.key==='Enter'){
    var wrap=document.getElementById('qt-wrap-'+ds);
    if(!wrap||!wrap.classList.contains('show')){
      if(wrap)wrap.classList.add('show');
      var xBtn=document.getElementById('qx-'+ds);
      if(xBtn)xBtn.style.display='block';
    } else {
      addTaskForDay(ds);
    }
  }
  if(e.key==='Backspace'){
    var inp=document.getElementById('qi-'+ds);
    if(inp&&inp.value==='')cancelDayInput(ds);
  }
  if(e.key==='Escape'){cancelDayInput(ds)}
}
function onDayInput(e,ds){}
function cancelDayInput(ds){
  var inp=document.getElementById('qi-'+ds);
  var wrap=document.getElementById('qt-wrap-'+ds);
  var xBtn=document.getElementById('qx-'+ds);
  if(inp){inp.value='';inp.blur();}
  if(wrap)wrap.classList.remove('show');
  if(xBtn)xBtn.style.display='none';
}

// ── BACKLOG ────────────────────────────────────────────
function onBacklogKey(e){if(e.key==='Enter')addBacklogItem()}
function addBacklogItem(){
  var inp=document.getElementById('bl-input');
  var name=inp?inp.value.trim():'';
  if(!name)return;
  var date=document.getElementById('bl-date').value;
  var from=document.getElementById('bl-from').value||'09:00';
  var to=addOneHour(from);
  if(date){
    var dayOfWeek=new Date(date).getDay();
    if(dayOfWeek===0){alert('Niedziele są zablokowane. Wybierz inny dzień.');return;}
    S.tasks.push({id:Date.now(),name:name,date:date,from:from,to:to,hours:1,note:'',done:false});
    var d=new Date(date);
    taskViewY=d.getFullYear();taskViewM=d.getMonth();
    save();renderTasks();renderSidebarBacklog();
  } else {
    S.backlog.push({id:Date.now(),name:name});
    save();renderBacklog();renderSidebarBacklog();
  }
  inp.value='';
  document.getElementById('bl-date').value='';
  document.getElementById('bl-from').value='';
}
function addOneHour(t){
  var parts=t.split(':');
  var h=parseInt(parts[0])||9;
  var m=parseInt(parts[1])||0;
  h=h+1;if(h>23)h=23;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function autoFillTo(ds){
  var fr=document.getElementById('qf-'+ds);
  var to=document.getElementById('qt-'+ds);
  if(fr&&to&&!to.value)to.value=addOneHour(fr.value);
}
function autoFillModalTo(){
  var fr=document.getElementById('em-from');
  var to=document.getElementById('em-to');
  if(fr&&to)to.value=addOneHour(fr.value);
}
function removeBacklogItem(id){
  S.backlog=S.backlog.filter(function(x){return x.id!==id});
  save();renderBacklog();renderSidebarBacklog();
}
function renderBacklog(){
  var el=document.getElementById('backlog-list');
  if(!el)return;
  if(!S.backlog.length){el.innerHTML='<div class="empty-msg" style="padding:1rem">Brak spraw – dodaj coś powyżej.</div>';return}
  var h='';
  S.backlog.forEach(function(item){
    h+='<div class="backlog-item" draggable="true" data-id="'+item.id+'" ondragstart="onBacklogDragStart(event,'+item.id+')">';
    h+='<span class="bl-handle">⠿</span>';
    h+='<span class="bl-name" style="cursor:pointer" onclick="openBacklogModal('+item.id+')">'+item.name+'</span>';
    h+='<button class="bl-del" onclick="removeBacklogItem('+item.id+')">✕</button>';
    h+='</div>';
  });
  el.innerHTML=h;
}
function renderSidebarBacklog(){
  var el=document.getElementById('sidebar-backlog-list');
  if(!el)return;
  if(!S.backlog.length){el.innerHTML='<div style="font-size:.75rem;color:var(--ink3);text-align:center;padding:.5rem 0">Backlog pusty 🎉</div>';return}
  var h='';
  S.backlog.forEach(function(item){
    h+='<div class="backlog-item" draggable="true" data-id="'+item.id+'" ondragstart="onBacklogDragStart(event,'+item.id+')">';
    h+='<span class="bl-handle">⠿</span>';
    h+='<span class="bl-name">'+item.name+'</span>';
    h+='</div>';
  });
  el.innerHTML=h;
}

// ── DRAG & DROP ─────────────────────────────────────────
var draggedBacklogId=null;
function onBacklogDragStart(e,id){
  draggedBacklogId=id;
  e.dataTransfer.effectAllowed='move';
  e.currentTarget.classList.add('dragging');
  setTimeout(function(){if(e.currentTarget)e.currentTarget.classList.remove('dragging')},0);
}
function onDayDragOver(e,ds){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  var col=document.getElementById('dc-'+ds);
  if(col)col.classList.add('drag-over');
}
function onDayDragLeave(ds){
  var col=document.getElementById('dc-'+ds);
  if(col)col.classList.remove('drag-over');
}
function onDayDrop(e,ds){
  e.preventDefault();
  var col=document.getElementById('dc-'+ds);
  if(col)col.classList.remove('drag-over');
  if(!draggedBacklogId)return;
  var item=S.backlog.find(function(x){return x.id===draggedBacklogId});
  if(!item)return;
  S.tasks.push({id:Date.now(),name:item.name,date:ds,from:'09:00',to:'10:00',hours:1,note:'',done:false});
  S.backlog=S.backlog.filter(function(x){return x.id!==draggedBacklogId});
  draggedBacklogId=null;
  save();renderTasks();renderSidebarBacklog();renderBacklog();
}


function renderTasks(){
  var MNAMES=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  var DNAMES=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'];
  var lbl=document.getElementById('tasks-month-label');
  if(lbl)lbl.textContent=MNAMES[taskViewM]+' '+taskViewY;
  var dim=new Date(taskViewY,taskViewM+1,0).getDate();
  var grid=document.getElementById('tasks-month-grid');
  if(!grid)return;

  // move all past undone tasks to today
  var changed=false;
  S.tasks.forEach(function(t){
    if(!t.done&&t.date<TODAY){t.date=TODAY;changed=true;}
  });
  if(changed)save();

  // hide overdue banner (no longer needed)
  var banner=document.getElementById('tasks-overdue-banner');
  if(banner)banner.innerHTML='';

  var htmlFuture='';
  var htmlPast='';
  var todayY=new Date().getFullYear(),todayM=new Date().getMonth(),todayD=new Date().getDate();
  var isCurrentMonth=(taskViewY===todayY&&taskViewM===todayM);

  // build ordered day list: today..dim, then 1..yesterday (for current month)
  // for other months: just 1..dim
  var days=[];
  if(isCurrentMonth){
    for(var d=todayD;d<=dim;d++)days.push(d);
    for(var d=1;d<todayD;d++)days.push(d);
  } else {
    for(var d=1;d<=dim;d++)days.push(d);
  }

  days.forEach(function(d){
    var ds=taskViewY+'-'+String(taskViewM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dateObj=new Date(taskViewY,taskViewM,d);
    var dow=dateObj.getDay();
    var isToday=ds===TODAY;
    var isPast=ds<TODAY;
    var isWeekend=dow===0||dow===6;
    var isSunday=dow===0;
    var cls='day-row'+(isToday?' is-today':isPast?' is-past':'')+(isWeekend?' is-weekend':'')+(isSunday?' is-sunday':'');
    var dname=DNAMES[dow];

    var dayTasks=S.tasks.filter(function(t){return!t.done&&t.date===ds});
    dayTasks.sort(function(a,b){return a.from.localeCompare(b.from)});
    var tasksHtml='';
    dayTasks.forEach(function(t){
      tasksHtml+='<div class="task-item" id="ti-'+t.id+'">';
      tasksHtml+='<input type="checkbox" onchange="completeTask('+t.id+')">';
      tasksHtml+='<div style="flex:1;cursor:pointer" onclick="openEditModal('+t.id+')">';
      tasksHtml+='<span class="task-name">'+t.name+'</span>';
      tasksHtml+='<div class="task-meta">'+t.from+'–'+t.to+' · '+t.hours+'h</div></div>';
      tasksHtml+='<button onclick="removeTask('+t.id+')" style="background:transparent;border:none;cursor:pointer;color:var(--ink3);padding:.1rem .3rem;font-size:.75rem;line-height:1">✕</button>';
      tasksHtml+='</div>';
    });

    var dlChips='';
    S.deadlines.filter(function(dl){return dl.date===ds&&!dl.done}).forEach(function(dl){
      dlChips+='<div class="day-deadline-chip">⚑ '+dl.name+'</div>';
    });

    var rowHtml='<div class="'+cls+'" id="dr-'+ds+'">';
    rowHtml+='<div class="day-num-col"><div class="day-num">'+d+'</div><div class="day-name">'+dname+'</div></div>';
    if(isSunday){
      rowHtml+='<div class="day-content day-sunday-block"></div></div>';
      if(isPast)htmlPast+=rowHtml; else htmlFuture+=rowHtml;
      return;
    }
    rowHtml+='<div class="day-content" id="dc-'+ds+'" ondragover="onDayDragOver(event,\''+ds+'\')" ondragleave="onDayDragLeave(\''+ds+'\')" ondrop="onDayDrop(event,\''+ds+'\')">';
    if(dlChips)rowHtml+=dlChips;
    if(tasksHtml)rowHtml+='<div class="day-tasks-list">'+tasksHtml+'</div>';
    rowHtml+='<div class="day-add-row" id="dar-'+ds+'">';
    rowHtml+='<input class="day-quick-input" id="qi-'+ds+'" placeholder="+ dodaj zadanie..." ';
    rowHtml+='onfocus="showDayTimeInputs(\''+ds+'\')" onkeydown="onDayKeydown(event,\''+ds+'\')" oninput="onDayInput(event,\''+ds+'\')">';
    rowHtml+='<button class="day-cancel-btn" id="qx-'+ds+'" style="display:none" onclick="cancelDayInput(\''+ds+'\')">✕</button>';
    rowHtml+='</div>';
    rowHtml+='<div class="day-time-inputs" id="qt-wrap-'+ds+'">';
    rowHtml+='<input type="time" id="qf-'+ds+'" value="09:00" min="08:00" max="22:00" style="width:80px" onchange="autoFillTo(\''+ds+'\')">';
    rowHtml+='<button class="btn btn-sm btn-sage day-add-confirm" onclick="addTaskForDay(\''+ds+'\')" >Dodaj</button>';
    rowHtml+='</div>';
    rowHtml+='</div></div>';

    if(isPast) htmlPast+=rowHtml; else htmlFuture+=rowHtml;
  });

  var pastCount=days.filter(function(d){
    var ds=taskViewY+'-'+String(taskViewM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    return ds<TODAY;
  }).length;

  var pastSection='';
  if(htmlPast){
    pastSection='<details class="past-days-details"><summary class="past-days-summary">Poprzednie dni ('+pastCount+')</summary><div class="month-grid">'+htmlPast+'</div></details>';
  }

  grid.innerHTML=htmlFuture+pastSection;

  // scroll today into view
  var todayRow=document.getElementById('dr-'+TODAY);
  if(todayRow)setTimeout(function(){todayRow.scrollIntoView({behavior:'smooth',block:'start'})},50);
}

function completeTask(id){
  var row=document.getElementById('ti-'+id);
  if(!row)return;
  var nm=row.querySelector('.task-name');
  nm.classList.add('done');
  setTimeout(function(){
    row.classList.add('fade-out');
    setTimeout(function(){
      var t=S.tasks.find(function(x){return x.id===id});
      if(t){t.done=true;}
      S.tasks=S.tasks.filter(function(x){return x.id!==id});
      save();renderTasks();
    },350);
  },2000);
}
function removeTask(id){S.tasks=S.tasks.filter(function(x){return x.id!==id});save();renderTasks()}

// ── DEADLINES ──────────────────────────────────────────
function addDeadline(){
  var n=document.getElementById('d-name').value.trim();
  var d=document.getElementById('d-date').value;
  var dc=document.getElementById('d-desc').value.trim();
  if(!n||!d)return alert('Podaj nazwę i termin.');
  S.deadlines.push({id:Date.now(),name:n,date:d,desc:dc,done:false});
  save();renderDeadlines();
  ['d-name','d-date','d-desc'].forEach(function(id){document.getElementById(id).value=''});
}
function renderDeadlines(){
  var el=document.getElementById('deadlines-list');
  if(!S.deadlines.length){el.innerHTML='<div class="empty-msg">Brak terminów.</div>';return}
  var list=[...S.deadlines].sort(function(a,b){return a.date.localeCompare(b.date)});
  var h='';
  list.forEach(function(d){
    var days=daysUntil(d.date),bc,bs;
    if(d.done){bc='b-sage';bs='Gotowe ✓'}
    else if(days<0){bc='b-rose';bs='Minął '+Math.abs(days)+'d temu'}
    else if(days===0){bc='b-rose';bs='Dziś!'}
    else if(days<=7){bc='b-gold';bs='Za '+days+' dni'}
    else{bc='b-gray';bs='Za '+days+' dni'}
    h+='<div class="dl-item'+(d.done?' dl-done':'')+'"><div style="flex:1">';
    h+='<div class="dl-name">'+(d.done?'✓ ':'')+d.name+'</div>';
    if(d.desc)h+='<div class="dl-sub">'+d.desc+'</div>';
    h+='<div class="dl-sub">'+d.date+'</div></div>';
    h+='<span class="badge '+bc+'">'+bs+'</span>';
    if(!d.done)h+='<button class="btn btn-sm" onclick="doneDeadline('+d.id+')" style="margin-left:.4rem">✓</button>';
    h+='<button class="btn btn-sm" onclick="removeDeadline('+d.id+')" style="margin-left:.3rem;color:var(--ink3)">✕</button></div>';
  });
  el.innerHTML=h;
}
function doneDeadline(id){var d=S.deadlines.find(function(x){return x.id===id});if(d)d.done=!d.done;save();renderDeadlines()}
function removeDeadline(id){S.deadlines=S.deadlines.filter(function(x){return x.id!==id});save();renderDeadlines()}

// ── BOOKS ──────────────────────────────────────────────
function addBook(){
  var t=document.getElementById('b-title').value.trim();
  var y=document.getElementById('b-year').value;
  var s=document.getElementById('b-status').value;
  var c=document.getElementById('b-chapter').value.trim();
  if(!t)return alert('Podaj tytuł.');
  S.books.push({id:Date.now(),title:t,year:y,status:s,chapter:c});
  save();renderBooks();
  ['b-title','b-year','b-chapter'].forEach(function(id){document.getElementById(id).value=''});
}
function renderBooks(){
  var pl=document.getElementById('books-progress');
  var el=document.getElementById('books-list');
  if(!S.books.length){pl.innerHTML='';el.innerHTML='<div class="empty-msg">Brak pozycji.</div>';return}
  var tot=S.books.length,done=S.books.filter(function(b){return b.status==='przeczytana'}).length;
  var pct=Math.round(done/tot*100);
  pl.innerHTML='<div class="card" style="padding:1rem 1.5rem;margin-bottom:1rem"><div style="display:flex;justify-content:space-between;font-size:.875rem;margin-bottom:.4rem"><span>Przeczytane: <strong>'+done+'/'+tot+'</strong></span><span style="color:var(--ink3)">'+pct+'%</span></div><div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
  var statusBadge={'do przeczytania':'b-gray','w trakcie':'b-gold','przeczytana':'b-sage'};
  var groups={'do przeczytania':[],'w trakcie':[],'przeczytana':[]};
  S.books.forEach(function(b){groups[b.status].push(b)});
  var h='';
  function sec(list,lbl){
    if(!list.length)return '';
    var s='<h3 style="margin-bottom:.4rem;margin-top:.75rem">'+lbl+'</h3>';
    list.forEach(function(b){
      s+='<div class="book-item" style="cursor:pointer" onclick="openBookModal('+b.id+')">';
      s+='<div style="flex:1"><div class="book-title">'+b.title+'</div>';
      if(b.year||b.chapter)s+='<div class="book-sub">'+(b.year?b.year:'')+(b.chapter?' · '+b.chapter:'')+'</div>';
      s+='</div>';
      s+='<span class="badge '+statusBadge[b.status]+'" style="margin-right:.5rem">'+b.status+'</span>';
      s+='<button class="btn btn-sm" onclick="event.stopPropagation();removeBook('+b.id+')" style="color:var(--ink3)">✕</button>';
      s+='</div>';
    });
    return s;
  }
  h+=sec(groups['przeczytana'],'✓ Przeczytane');
  h+=sec(groups['w trakcie'],'📖 W trakcie');
  h+=sec(groups['do przeczytania'],'📚 Do przeczytania');
  el.innerHTML=h;
}

// ── CALENDAR ───────────────────────────────────────────
var DAYS=['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
var MONTHS=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
function changeMonth(dir){S.calM+=dir;if(S.calM>11){S.calM=0;S.calY++}if(S.calM<0){S.calM=11;S.calY--}save();renderCalendar()}
function renderCalendar(){
  document.getElementById('month-label').textContent=MONTHS[S.calM]+' '+S.calY;
  var hd=document.getElementById('cal-headers');
  hd.innerHTML=DAYS.map(function(d){return'<div class="cal-hdr">'+d+'</div>'}).join('');
  var first=new Date(S.calY,S.calM,1);
  var startDay=(first.getDay()+6)%7;
  var dim=new Date(S.calY,S.calM+1,0).getDate();
  var prev=new Date(S.calY,S.calM,0).getDate();
  var cells=[];
  for(var i=startDay-1;i>=0;i--)cells.push({day:prev-i,cur:false});
  for(var d=1;d<=dim;d++)cells.push({day:d,cur:true});
  while(cells.length%7!==0)cells.push({day:cells.length-dim-startDay+1,cur:false});
  var body=document.getElementById('cal-body');
  body.innerHTML=cells.map(function(c){
    if(!c.cur)return'<div class="cal-cell other"><div class="cal-num">'+c.day+'</div></div>';
    var ds=S.calY+'-'+String(S.calM+1).padStart(2,'0')+'-'+String(c.day).padStart(2,'0');
    var isT=ds===TODAY;
    var dots='';
    S.tasks.filter(function(t){return!t.done&&t.date===ds}).slice(0,2).forEach(function(t){dots+='<div class="cal-dot t">'+t.from+' '+t.name.slice(0,10)+'</div>'});
    S.deadlines.filter(function(d){return d.date===ds}).slice(0,1).forEach(function(d){dots+='<div class="cal-dot d">⚑ '+d.name.slice(0,10)+'</div>'});
    return'<div class="cal-cell'+(isT?' today':'')+'" onclick="calClick(\''+ds+'\')"><div class="cal-num">'+c.day+'</div>'+dots+'</div>';
  }).join('');
}

function calClick(ds){
  var d=new Date(ds);
  taskViewY=d.getFullYear();taskViewM=d.getMonth();
  showTab('tasks');
  setTimeout(function(){
    var inp=document.getElementById('qi-'+ds);
    if(inp){inp.focus();inp.scrollIntoView({behavior:'smooth',block:'center'})}
  },100);
}

var editingTaskId=null;

  var t=S.tasks.find(function(x){return x.id===id});
  if(!t)return;
  editingTaskId=id;
  document.getElementById('em-name').value=t.name;
  document.getElementById('em-date').value=t.date;
  document.getElementById('em-from').value=t.from;
  document.getElementById('em-to').value=t.to||addOneHour(t.from);
  document.getElementById('edit-modal').style.display='flex';
}
function closeEditModal(e){
  if(e&&e.target!==document.getElementById('edit-modal'))return;
  document.getElementById('edit-modal').style.display='none';
  editingTaskId=null;
}
function saveEditModal(){
  var t=S.tasks.find(function(x){return x.id===editingTaskId});
  if(!t)return;
  t.name=document.getElementById('em-name').value.trim()||t.name;
  t.date=document.getElementById('em-date').value||t.date;
  if(new Date(t.date).getDay()===0){alert('Niedziele są zablokowane. Wybierz inny dzień.');t.date=document.getElementById('em-date').defaultValue||t.date;return;}
  t.from=document.getElementById('em-from').value||t.from;
  t.to=document.getElementById('em-to').value||addOneHour(t.from);
  var a=t.from.split(':'),b=t.to.split(':');
  var mins=(parseInt(b[0])*60+parseInt(b[1]))-(parseInt(a[0])*60+parseInt(a[1]));
  t.hours=mins>0?Math.round(mins/60*10)/10:1;
  var d=new Date(t.date);
  taskViewY=d.getFullYear();taskViewM=d.getMonth();
  document.getElementById('edit-modal').style.display='none';
  editingTaskId=null;
  save();renderTasks();renderSidebarBacklog();
}
